name = "EPPAReducts"
version = "0.1.0"
defaultTargets = ["EPPAReducts"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

# Reuse the typed language, embeddings, and (coherent) EPPA vocabulary;
# the two substantive results will be proved in this repository.
[[require]]
name = "AllThoseEPPA"
git = "https://github.com/shulda/lean_all_those_eppa_classes.git"
rev = "d85fda061d0b43f2b78c2470ce51f16ecf5c4e8d"

[[lean_lib]]
name = "EPPAReducts"
